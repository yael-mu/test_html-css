<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>
    <section class="all">
        <header>
            <div class="top-bar">
                <div class="logo-section">
                    <div class="shield-icon"><img src="img/shield.svg" alt=""></div>
                </div>
                <div class="title">SIGINT OPS</div>
                <div class="status-badge">
                    • SECURE • ONLINE
                </div>
            </div>
        </header>
        <main>
            <section class="main">
                <div class="radar_left">
                    <div class='radar'>
                        <div class='sweep'></div>
                        <div class="radar-blip blip-1"></div>
                        <div class="radar-blip blip-2"></div>
                        <div class="radar-blip blip-3"></div>

                    </div>
                </div>
                <div class="stats-section">
                    <div class="stat-group">
                        <div class="stat-value">24</div>
                        <div class="stat-label">ACTIVE SIGNALS</div>
                    </div>
                    <div class="stat-group">
                        <div class="stat-value">07</div>
                        <div class="stat-label">PRIORITY ALERTS</div>
                    </div>
                </div>
            </section>
            <section class="button">
                <button class="btn"><i class="fa-solid fa-bolt"></i>New Brief</button>
                <button class="btn"><i class="fa-solid fa-code"></i>Decode</button>
                <button class="btn"><i class="fa-solid fa-plane"></i>Request Drone</button>
            </section>
            <section class="all_card">
                <div class="card" style="border-left: 2px solid #ff3366;">
                    <div class="card-header">
                        <span class="tag tag-critical">CRITICAL</span>
                        <span class="card-status">In Progress</span>
                    </div>
                    <div class="card-title">Operation Nightfall</div>
                    <div class="progress-container">
                        <div class="progress-bar red" style="width: 65%;"></div>
                    </div>
                    <div class="card-footer">65%</div>
                </div>

                <div class="card" style="border-left: 2px solid #ffaa00;">
                    <div class="card-header">
                        <span class="tag tag-high">HIGH</span>
                        <span class="card-status">Analyzing</span>
                    </div>
                    <div class="card-title">Signal Intercept Alpha</div>
                    <div class="progress-container">
                        <div class="progress-bar yellow" style="width: 40%;"></div>
                    </div>
                    <div class="card-footer">40%</div>
                </div>

                <div class="card" style="border-left: 2px solid #00ff66;">
                    <div class="card-header">
                        <span class="tag tag-medium">MEDIUM</span>
                        <span class="card-status">Pending</span>
                    </div>
                    <div class="card-title">Asset Recovery</div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 15%;"></div>
                    </div>
                    <div class="card-footer">15%</div>
                </div>

                <div class="card" style="border-left: 2px solid #ffaa00;">
                    <div class="card-header">
                        <span class="tag tag-high">HIGH</span>
                        <span class="card-status">Active</span>
                    </div>
                    <div class="card-title">Cyber Defense Grid</div>
                    <div class="progress-container">
                        <div class="progress-bar" style="width: 80%;"></div>
                    </div>
                    <div class="card-footer">80%</div>
                </div>
            </section>
            <div class="threat">
                <p id="point">•</p>
                <p>THREAT DETECTED</p>
            </div>
        </main>
    </section>

    <footer>
        <div class="icon" tabindex="0">
            <span><i class="fa-solid fa-chart-line"></i></span>
            <span>Dashboard</span>
        </div>
        <div class="icon" tabindex="0">
            <span><i class="fa fa-rss"></i></span>
            <span>Feed</span>
        </div>
        <div class="icon" tabindex="0">
            <span><i class="fa-regular fa-file-lines"></i></span>
            <span>Brief</span>
        </div>
    </footer>
</body>

</html>
